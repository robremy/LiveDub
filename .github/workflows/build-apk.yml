name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LiveDub-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish as "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LiveDub.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LiveDub.apk --title "LiveDub (latest build)" \
            --notes "Debug APK built from commit ${GITHUB_SHA}" --prerelease
